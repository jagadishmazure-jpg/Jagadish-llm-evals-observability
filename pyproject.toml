[project]
name = "jagadish-llm-evals-observability"
version = "0.1.0"
description = "LLM evaluation and observability as code: judges, regression suites, metrics, tracing, and analytics."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jagadish" }]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = false
